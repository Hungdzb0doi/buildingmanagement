<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="utf-8" />
    <title>Quên mật khẩu - CRM Building Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/assets/css/ace.min.css" class="ace-main-stylesheet" id="main-ace-style" />
    <link rel="stylesheet" href="/assets/css/ace-skins.min.css" />
    <link rel="stylesheet" href="/assets/css/ace-rtl.min.css" />

    <style>
        :root {
            var(--primary-blue): #438EB9;
            --primary-blue-hover: #3276B1;
            --primary-green: #87B87F;
            --primary-green-hover: #629B58;
            --text-dark: #393939;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            font-weight: 300 !important;
            background-color: #F2F2F2 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .forgot-container {
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        .forgot-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #E5E5E5;
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-header h2 {
            font-weight: 500 !important;
            color: var(--text-dark);
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .forgot-header p {
            color: #707070;
            font-size: 14px;
        }

        label {
            font-weight: 500 !important;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
            margin-top: 15px;
        }

        .form-control {
            border-radius: 6px !important;
            height: 42px !important;
            border: 1px solid #D5D5D5 !important;
            padding-left: 15px !important;
            font-weight: 400 !important;
            transition: all 0.3s ease;
            color: var(--text-dark) !important;
        }

        .form-control:focus {
            border-color: #438EB9 !important;
            box-shadow: 0 0 0 3px rgba(67, 142, 185, 0.15) !important;
        }

        .btn-custom {
            width: 100%;
            height: 42px;
            border: none !important;
            border-radius: 6px !important;
            color: white !important;
            font-weight: 500 !important;
            margin-top: 20px;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.2) !important;
            transition: all 0.2s ease;
        }

        .btn-blue { background-color: #438EB9 !important; }
        .btn-blue:hover { background-color: #3276B1 !important; }

        .btn-green { background-color: #87B87F !important; }
        .btn-green:hover { background-color: #629B58 !important; }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .footer-link a {
            color: #438EB9;
            font-weight: 500;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="login-layout light-login">
<div class="forgot-container">
    <div class="forgot-box">
        <div class="forgot-header">
            <i class="fa fa-key fa-3x" style="color: #438EB9;"></i>
            <h2>Khôi phục mật khẩu</h2>
            <p id="header-desc">Nhập email để nhận mã xác thực hệ thống</p>
        </div>

        <!-- BƯỚC 1: NHẬP EMAIL -->
        <div id="step-1-email">
            <div class="form-group">
                <label>Email đã đăng ký <span style="color: #D15B47;">*</span></label>
                <input type="email" id="forgot-email" class="form-control" placeholder="example@email.com" required>
            </div>

            <button type="button" class="btn-custom btn-blue" id="btnSendOtp">
                Gửi mã xác thực
            </button>
        </div>

        <!-- BƯỚC 2: NHẬP OTP VÀ MẬT KHẨU MỚI (Ẩn mặc định) -->
        <div id="step-2-reset" style="display: none;">
            <div class="alert alert-success" style="padding: 10px; border-radius: 6px; font-size: 13px; margin-top: -10px;">
                <i class="fa fa-check"></i> Mã xác thực đã được gửi! Vui lòng kiểm tra email.
            </div>

            <div class="form-group">
                <label>Mã xác thực (OTP) <span style="color: #D15B47;">*</span></label>
                <input type="text" id="reset-otp" class="form-control" placeholder="Nhập mã 6 số..." style="text-align: center; font-size: 18px; letter-spacing: 5px;" required>
            </div>

            <div class="form-group">
                <label>Mật khẩu mới <span style="color: #D15B47;">*</span></label>
                <div style="position: relative;">
                    <input type="password" id="reset-new-password" class="form-control" placeholder="Từ 6 ký tự trở lên" required>
                    <i class="fa fa-eye toggle-password" style="position: absolute; right: 15px; top: 13px; cursor: pointer; color: #ABBAC3;"></i>
                </div>
            </div>

            <button type="button" class="btn-custom btn-green" id="btnResetPassword">
                Xác nhận đổi mật khẩu
            </button>

            <div style="text-align: center; margin-top: 15px;">
                <a href="#" id="btnBackToEmail" style="color: #438EB9; font-size: 13px;"><i class="fa fa-arrow-left"></i> Nhập lại email khác</a>
            </div>
        </div>

        <div class="footer-link">
            <a href="/interface/login"><i class="fa fa-angle-left"></i> Quay lại trang Đăng nhập</a>
        </div>
    </div>
</div>

<script src="/assets/js/jquery-2.1.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/ace-elements.min.js"></script>
<script src="/assets/js/ace.min.js"></script>
<script>
    $(document).ready(function() {
        // 1. Ẩn/hiện mật khẩu
        $('.toggle-password').click(function() {
            const passwordField = $(this).siblings('input');
            const type = passwordField.attr('type') === 'password' ? 'text' : 'password';
            passwordField.attr('type', type);
            $(this).toggleClass('fa-eye fa-eye-slash');
        });

        // Gửi mã OTP
        $('#btnSendOtp').click(function(e) {
            e.preventDefault();
            const email = $('#forgot-email').val().trim();

            if (!email) {
                alert("Vui lòng nhập địa chỉ email!");
                return;
            }

            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Đang gửi...').prop("disabled", true);


            $.ajax({
                type: 'POST',
                url: 'http://localhost:8082/api/auth/forgotpassword',
                data: {
                    email: email
                },
                success: function(response) {
                    // Thành công -> Chuyển sang form 2
                    $('#step-1-email').hide();
                    $('#header-desc').text("Nhập mã OTP và thiết lập mật khẩu mới");
                    $('#step-2-reset').fadeIn();
                    btn.html(originalText).prop("disabled", false);
                },
                error: function(err) {
                    btn.html(originalText).prop("disabled", false);
                    alert(err.responseText || "Lỗi: Không thể gửi email. Vui lòng kiểm tra lại!");
                }
            });
        });

        // 3. BƯỚC 2: Xác nhận đổi mật khẩu
        $('#btnResetPassword').click(function(e) {
            e.preventDefault();
            const email = $('#forgot-email').val().trim();
            const otp = $('#reset-otp').val().trim();
            const newPassword = $('#reset-new-password').val();

            if (!otp || !newPassword) {
                alert("Vui lòng nhập đầy đủ mã OTP và Mật khẩu mới!");
                return;
            }
            if (newPassword.length < 6) {
                alert("Mật khẩu mới phải từ 6 ký tự trở lên!");
                return;
            }

            const btn = $(this);
            const originalText = btn.html();
            btn.html('<i class="fa fa-spinner fa-spin"></i> Đang xử lý...').prop("disabled", true);

            const requestData = {
                email: email,
                otp: otp,
                newPassword: newPassword
            };


            $.ajax({
                type: 'POST',
                url: 'http://localhost:8082/api/auth/resetpassword',
                data:requestData,

                success: function(response) {
                    alert("Đổi mật khẩu thành công! Chuyển hướng về trang đăng nhập.");
                    window.location.href = "/interface/login";
                },
                error: function(err) {
                    btn.html(originalText).prop("disabled", false);
                    alert(err.responseText || "Lỗi: Mã OTP không hợp lệ hoặc đã hết hạn!");
                }
            });
        });

        // 4. Nút quay lại nhập email
        $('#btnBackToEmail').click(function(e) {
            e.preventDefault();
            $('#step-2-reset').hide();
            $('#header-desc').text("Nhập email để nhận mã xác thực hệ thống");
            $('#step-1-email').fadeIn();
        });
    });
</script>
</body>
</html>
