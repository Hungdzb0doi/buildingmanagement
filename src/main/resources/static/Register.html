<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="utf-8" />
    <title>Đăng ký - CRM Building Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/assets/css/ace.min.css" class="ace-main-stylesheet" id="main-ace-style" />
    <link rel="stylesheet" href="/assets/css/ace-skins.min.css" />
    <link rel="stylesheet" href="/assets/css/ace-rtl.min.css" />

    <style>
        :root {
            /* Đồng bộ tông màu xanh Pastel của hệ thống Ace Admin */
            --primary-blue: #438EB9;    
            --primary-blue-hover: #3276B1; 
            --text-dark: #393939;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            font-weight: 300 !important;
            background-color: #F2F2F2 !important; /* Màu nền xám nhạt */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0; 
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }

        .register-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* Đổ bóng nhẹ đồng bộ */
            border: 1px solid #E5E5E5;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h2 {
            font-weight: 500 !important;
            color: var(--text-dark);
            margin-bottom: 10px;
            margin-top: 15px;
        }

        .register-header p {
            color: #707070;
            font-size: 14px;
        }

        label {
            font-weight: 500 !important;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
            margin-top: 15px;
        }

        .form-control {
            border-radius: 6px !important;
            height: 42px !important;
            border: 1px solid #D5D5D5 !important;
            padding-left: 15px !important;
            font-weight: 400 !important;
            transition: all 0.3s ease;
            color: var(--text-dark) !important;
        }

        .form-control:focus {
            border-color: var(--primary-blue) !important;
            box-shadow: 0 0 0 3px rgba(67, 142, 185, 0.15) !important; 
        }

        .btn-register {
            width: 100%;
            height: 42px;
            background-color: var(--primary-blue) !important; 
            border: none !important;
            border-radius: 6px !important;
            color: white !important;
            font-weight: 500 !important;
            margin-top: 25px;
            text-shadow: 0 -1px 0 rgba(0,0,0,0.2) !important;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background-color: var(--primary-blue-hover) !important;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #707070;
        }

        .footer-link a {
            color: var(--primary-blue);
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link a:hover {
            color: var(--primary-blue-hover);
            text-decoration: underline;
        }
    </style>
</head>

<body class="login-layout light-login">
<div class="register-container">
    <div class="register-box">
        <div class="register-header">

            <i class="fa fa-user-plus fa-3x" style="color: #438EB9;"></i>
            <h2>Tạo tài khoản mới</h2>
            <p>Điền thông tin để tham gia hệ thống CRM</p>
        </div>

        <form id="form-register">

            <div class="form-group">
                <label>Tên đăng nhập <span style="color: #D15B47;">*</span></label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập..." required>
            </div>


            <div class="form-group">
                <label>Email liên hệ <span style="color: #D15B47;">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
            </div>


            <div class="form-group">
                <label>Số điện thoại <span style="color: #D15B47;">*</span></label>
                <input type="text" id="phone" class="form-control" placeholder="098xxxxxxx" required>
            </div>


            <div class="form-group">
                <label>Mật khẩu <span style="color: #D15B47;">*</span></label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="Từ 6 ký tự trở lên" required>
                    <i class="fa fa-eye toggle-password" style="position: absolute; right: 15px; top: 13px; cursor: pointer; color: #ABBAC3;"></i>
                </div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="form-group">
                <label>Xác nhận mật khẩu <span style="color: #D15B47;">*</span></label>
                <div style="position: relative;">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                    <i class="fa fa-eye toggle-password" style="position: absolute; right: 15px; top: 13px; cursor: pointer; color: #ABBAC3;"></i>
                </div>
            </div>

            <button type="button" class="btn btn-register" id="btnRegister">
                Đăng ký tài khoản
            </button>
        </form>

        <div class="footer-link">
            Đã có tài khoản? <a href="/interface/login">Đăng nhập ngay</a>
        </div>
    </div>
</div>

<script src="/assets/js/jquery-2.1.4.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/ace-elements.min.js"></script>
<script src="/assets/js/ace.min.js"></script>
<script>
    $(document).ready(function() {
        // Xử lý logic ẩn/hiện mật khẩu
        $('.toggle-password').click(function() {
            const passwordField = $(this).siblings('input');
            const type = passwordField.attr('type') === 'password' ? 'text' : 'password';
            passwordField.attr('type', type);
            $(this).toggleClass('fa-eye fa-eye-slash');
        });


        $('#btnRegister').click(function(e) {
            e.preventDefault();


            const username = $('#username').val().trim();
            const email = $('#email').val().trim();
            const phone = $('#phone').val().trim();
            const password = $('#password').val();
            const confirmPassword = $('#confirmPassword').val();


            if(!username || !email || !phone || !password) {
                alert("Vui lòng nhập đầy đủ các trường bắt buộc!");
                return;
            }

            if(password.length < 6) {
                alert("Mật khẩu phải chứa ít nhất 6 ký tự!");
                return;
            }

            if(password !== confirmPassword) {
                alert("Mật khẩu xác nhận không khớp!");
                return;
            }


            var registerData = {
                username: username,
                password: password,
                email: email,
                phone: phone
            };


            const btn = $(this);
            const originalText = btn.text();
            btn.text("Đang xử lý...").prop("disabled", true);


            $.ajax({
                type: 'POST',
                url: 'http://localhost:8082/api/auth/register',
                data: JSON.stringify(registerData),
                contentType: 'application/json',
                success: function(response) {
                    alert("Đăng ký thành công! Vui lòng đăng nhập.");

                    window.location.href = "/interface/login";
                },
                error: function(err) {
                    btn.text(originalText).prop("disabled", false);

                    if(err.responseText) {
                        alert("Lỗi: " + err.responseText);
                    } else {
                        alert("Có lỗi xảy ra, vui lòng thử lại sau!");
                    }
                }
            });
        });
    });
</script>
</body>
</html>
